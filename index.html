<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Factures amb Ordre</title>

<!--
  Esta página no es contenido: es solo el reparto por idioma.

  El sitio está en GitHub Pages, que NO permite redirecciones de servidor: no hay
  .htaccess ni 301 que valgan. Así que el reparto se hace por JavaScript, y por eso
  lleva noindex (para que Google indexe /es/ y /ca/, no esta) y dos enlaces visibles
  dentro de <noscript>: sin ellos, quien llegue sin JavaScript se queda en blanco.
-->
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://facturesambordre.es/es/">
<link rel="alternate" hreflang="es" href="https://facturesambordre.es/es/">
<link rel="alternate" hreflang="ca" href="https://facturesambordre.es/ca/">
<link rel="alternate" hreflang="x-default" href="https://facturesambordre.es/es/">
<meta name="theme-color" content="#0A3F37">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/style.css">

<script>
(function () {
  // Mismo criterio que tenía el conmutador de antes: se mira la lista entera de
  // preferencias del navegador respetando su orden. Catalán si es lo primero que
  // pide; castellano si lo es el castellano; y castellano también para cualquier
  // otro idioma, porque es la versión que llega a más gente.
  var destino = '/es/';
  var lista = navigator.languages || [navigator.language || ''];
  for (var i = 0; i < lista.length; i++) {
    var l = String(lista[i]).toLowerCase();
    if (l.indexOf('ca') === 0) { destino = '/ca/'; break; }
    if (l.indexOf('es') === 0) { destino = '/es/'; break; }
  }
  // replace y no href: así el botón de "atrás" no devuelve aquí y deja al visitante
  // dando vueltas entre esta página y la home.
  location.replace(destino);
})();
</script>
</head>
<body>

<noscript>
  <section class="section">
    <div class="wrap" style="text-align:center">
      <h1>Factures amb Ordre</h1>
      <p class="lead" style="margin:0 auto 24px">Elige idioma / Tria idioma</p>
      <p>
        <a class="btn btn-primary" href="/es/" hreflang="es" lang="es">Castellano</a>
        <a class="btn btn-ghost" href="/ca/" hreflang="ca" lang="ca">Català</a>
      </p>
    </div>
  </section>
</noscript>

</body>
</html>
